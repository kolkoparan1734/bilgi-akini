services:
  - type: web
    name: bilgi-akini
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bilgi-akini-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: bilgi-akini-db
    plan: free
